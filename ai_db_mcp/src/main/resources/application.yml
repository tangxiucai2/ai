server:
  port: 9090

spring:
  application:
    name: ai_mcp
  ai:
    mcp:
      server:
        # STREAMABLE: 协议级二次确认需要会话对象; 回退改回 STATELESS 即可 (CONFIRM 会退化为一律拒绝)
        protocol: STREAMABLE
        # 必须大于 PolicyGate.CONFIRM_TIMEOUT_SEC(120s): SDK 用它限服务端→客户端请求(含 elicitation),
        # 默认 20s 会让等确认的调用 20 秒就抛"二次确认失败", 闸门那 120 秒永远走不到
        request-timeout: 130s
        name: AI MCP Server
        instructions: "提供数据库连接管理和远程主机SSH连接功能。支持创建和管理数据库连接、执行SQL语句、事务处理，以及SSH连接到远程主机执行命令。"
        annotation-scanner:
          enabled: true
          base-packages:
            - com.ai.mcp
        capabilities:
          tool: true

# 控制台对接 (智能体管控 → 访问网关)
console:
  url: http://127.0.0.1:5200/soag/api
  node-id: gw-change-me
  secret-file: ./data/gateway.secret

logging:
  level:
    com.ai.mcp: INFO
    org.springframework.ai: DEBUG
